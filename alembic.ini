# ==========================================================
# VIGILOX DOCUMENT INTELLIGENCE RESEARCH
# ALEMBIC CONFIGURATION
# ==========================================================
#
# Database credentials are not stored in this file.
#
# migrations/env.py reads DATABASE_URL from the environment,
# keeping migration configuration aligned with the
# application database configuration.
#
# Common commands:
#
#     alembic current
#     alembic history
#     alembic upgrade head
#     alembic downgrade -1
#
# Create a migration:
#
#     alembic revision --autogenerate -m "describe change"
#
# Review autogenerated migrations before applying them.
#
# ==========================================================

[alembic]

script_location = migrations

prepend_sys_path = .

file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

# DATABASE_URL is loaded by migrations/env.py.
sqlalchemy.url =


[post_write_hooks]


# ==========================================================
# ALEMBIC LOGGING
# ==========================================================

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S